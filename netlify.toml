[build]
  publish = "."
  command = ""

# Canonical host
[[redirects]]
  from = "https://www.idiglabs.com/*"
  to = "https://idiglabs.com/:splat"
  status = 301
  force = true

# Short links — everything currently points at the front page.
[[redirects]]
  from = "/free"
  to = "/"
  status = 301

[[redirects]]
  from = "/oldschool"
  to = "/"
  status = 301

[[redirects]]
  from = "/oldschool.html"
  to = "/"
  status = 301

# ---------------------------------------------------------------
# STAGED PAGES — not live yet.
# To launch a department: move the file from _staged/ back to the
# repo root, add its nav link, and delete its block below.
#   /instruments.html   _staged/instruments.html
#   /plugins.html       _staged/plugins.html
#   /software.html      _staged/software.html
#   /home-full.html     _staged/home-full.html  (original storefront homepage)
# Files inside _staged/ are excluded from crawling via robots.txt.
# ---------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/_staged/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
