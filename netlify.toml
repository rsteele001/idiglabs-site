# Only public/ is published. Everything at the repo root — CLAUDE.md,
# DEPLOY.md, this file, _staged/ — stays out of the deploy entirely.
[build]
  publish = "public"
  command = ""

# Canonical host
[[redirects]]
  from = "https://www.idiglabs.com/*"
  to = "https://idiglabs.com/:splat"
  status = 301
  force = true

# Short links — everything currently points at the front page.
[[redirects]]
  from = "/free"
  to = "/"
  status = 301

[[redirects]]
  from = "/oldschool"
  to = "/"
  status = 301

[[redirects]]
  from = "/oldschool.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/legal/terms.html"
  status = 301

[[redirects]]
  from = "/refunds"
  to = "/legal/refunds.html"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/legal/privacy.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

# Buy links — the apps' Buy buttons open these, so no store URL is compiled
# into an app (release.sh refuses one). 302, not 301: a browser must not
# cache the store page, so the target can change without an app update.
[[redirects]]
  from = "/buy/lost-and-found"
  to = "https://payhip.com/b/CJRxo"
  status = 302
  force = true

[[redirects]]
  from = "/buy/tag-and-find"
  to = "https://payhip.com/b/EorY0"
  status = 302
  force = true

# ---------------------------------------------------------------
# STAGED PAGES — not live yet.
# To launch a department: move the file from _staged/ into
# public/, add its nav link, and delete its block below.
#   /instruments.html   _staged/instruments.html
#   /plugins.html       _staged/plugins.html
#   /software.html      _staged/software.html
#   /home-full.html     _staged/home-full.html  (original storefront homepage)
# Files inside _staged/ are excluded from crawling via robots.txt.
# ---------------------------------------------------------------

# Staged pages are not public. Remove this rule when a page launches.
[[redirects]]
  from = "/_staged/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/_staged/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
