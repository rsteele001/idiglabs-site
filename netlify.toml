# ---------------------------------------------------------------
# _staged/ is empty: every staged page launched with the catalog.
# The rule stays so any old /_staged/ link lands somewhere.
# ---------------------------------------------------------------
[[redirects]]
  from = "/_staged/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/_staged/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
