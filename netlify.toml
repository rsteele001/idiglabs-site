# Only public/ is published. Everything at the repo root — CLAUDE.md,
# DEPLOY.md, this file, _staged/ — stays out of the deploy entirely.
[build]
  publish = "public"
  command = ""

# Canonical host
[[redirects]]
  from = "https://www.idiglabs.com/*"
  to = "https://idiglabs.com/:splat"
  status = 301
  force = true

# Short links. Old School moved from / to /oldschool.html when the
# catalog launched; /oldschool itself is served by pretty URLs.
[[redirects]]
  from = "/free"
  to = "/oldschool.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/legal/terms.html"
  status = 301

[[redirects]]
  from = "/refunds"
  to = "/legal/refunds.html"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/legal/privacy.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/how"
  to = "/how.html"
  status = 301

# Buy links — the apps' Buy buttons open these, so no store URL is compiled
# into an app (release.sh refuses one). 302, not 301: a browser must not
# cache the store page, so the target can change without an app update.
